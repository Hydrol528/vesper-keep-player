name: Build Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.13'
          architecture: x64
      - name: Install hash-locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Run unit checks
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $pwd 'src'
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/login-flow.cjs
      - name: Get pinned WiX toolset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile tools/wix.zip
          if ((Get-FileHash tools/wix.zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX checksum mismatch' }
          Expand-Archive tools/wix.zip tools/wix
      - name: Build installer and verify bundled app
        shell: pwsh
        run: ./Build.ps1 -WixPath "$pwd/tools/wix"
      - name: Attest installer origin
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/release/*.msi
      - name: Save preview installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vesper-Keep-Player-Windows-preview
          path: dist/release/
          if-no-files-found: error